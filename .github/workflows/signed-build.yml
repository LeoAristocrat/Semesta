name: Signed Android build

# Builds downloadable artifacts only. Publishing a GitHub Release is separate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Restore private signing key
        env:
          SEMESTA_KEYSTORE_BASE64: ${{ secrets.SEMESTA_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SEMESTA_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$SEMESTA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/semesta-release.jks"
      - name: Build signed APK and bundle
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/semesta-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          SEMESTA_VERSION="$(tr -d '\r\n' < VERSION)"
          [[ "$SEMESTA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]
          ./gradlew --no-daemon assembleRelease bundleRelease testReleaseUnitTest lintRelease verifyDesignTokens "-PversionName=$SEMESTA_VERSION" --max-workers=2
      - name: Verify APK and prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/
          cp app/build/outputs/bundle/release/*.aab release-artifacts/
          cp app/build/outputs/mapping/release/mapping.txt release-artifacts/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release-artifacts/*.apk > release-artifacts/signature.txt
          SIGNER_DIGEST="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-artifacts/signature.txt)"
          EXPECTED_DIGEST="$(tr -d '\r\n' < branding/release-certificate.sha256)"
          test "$SIGNER_DIGEST" = "$EXPECTED_DIGEST"
          (cd release-artifacts && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semesta-signed-release
          path: release-artifacts/
          retention-days: 30
          if-no-files-found: error
      - name: Remove private signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/semesta-release.jks"
